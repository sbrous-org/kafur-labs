<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assam Travel Planner</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        :root {
            --primary: #0f766e;
            --primary-light: #14b8a6;
            --accent: #ea580c;
            --accent-light: #fb923c;
            --ground: #faf5f0;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --weather-blue: #3b82f6;
            --success-green: #10b981;
            --spacing: 1rem;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --ground: #0f172a;
                --text: #f1f5f9;
                --text-secondary: #cbd5e1;
                --border: #334155;
            }
        }

        :root[data-theme="dark"] {
            --ground: #0f172a;
            --text: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--ground);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            padding: 24px 20px;
            border-bottom: 2px solid var(--primary);
            background: var(--ground);
        }

        .header h1 {
            font-family: 'Lora', serif;
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            padding: 20px;
            flex: 1;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
            background: var(--ground);
            border-radius: 12px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--ground);
        }

        .welcome {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .welcome h2 {
            font-family: 'Lora', serif;
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        /* Trip Plan Card */
        .trip-plan {
            background: white;
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .trip-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--primary);
        }

        .trip-header h2 {
            font-family: 'Lora', serif;
            font-size: 24px;
            color: var(--primary);
            font-weight: 700;
        }

        .trip-duration {
            color: var(--accent);
            font-weight: 600;
            font-size: 14px;
        }

        .days-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .day-card {
            background: linear-gradient(135deg, #f0fdfa 0%, #f1f5f9 100%);
            border: 2px solid var(--primary-light);
            border-radius: 10px;
            padding: 16px;
            position: relative;
        }

        .day-card::before {
            content: attr(data-day);
            position: absolute;
            top: -14px;
            left: 20px;
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .day-title {
            font-family: 'Lora', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .activities {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .activity {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 10px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }

        .activity-time {
            font-family: 'Inter', monospace;
            font-weight: 600;
            color: var(--accent);
            font-size: 12px;
            min-width: 50px;
        }

        .activity-text {
            color: var(--text);
            font-size: 14px;
            line-height: 1.4;
        }

        /* Weather Card */
        .weather-card {
            background: linear-gradient(135deg, var(--weather-blue) 0%, #1e40af 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin: 16px 0;
        }

        .weather-header {
            font-family: 'Lora', serif;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 12px;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .weather-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
        }

        .weather-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .weather-value {
            font-size: 20px;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Place Card */
        .place-card {
            background: linear-gradient(135deg, #fef2f2 0%, #ffe4e6 100%);
            border: 2px solid var(--accent);
            border-radius: 10px;
            padding: 16px;
            margin: 12px 0;
        }

        .place-name {
            font-family: 'Lora', serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .place-info {
            color: var(--text);
            font-size: 13px;
            line-height: 1.5;
        }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 8px;
            padding: 16px;
            background: var(--ground);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: white;
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        .input-area input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
        }

        .input-area button {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background: var(--primary-light);
        }

        .input-area button:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow-y: auto;
            max-height: 100%;
        }

        .sidebar-section {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .sidebar-section:last-child {
            border-bottom: none;
        }

        .sidebar-title {
            font-weight: 600;
            font-size: 12px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .sidebar-btn {
            display: block;
            width: 100%;
            padding: 10px 12px;
            text-align: left;
            background: var(--ground);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
            transition: all 0.2s;
            margin-bottom: 6px;
        }

        .sidebar-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .loading {
            display: flex;
            gap: 4px;
            align-items: center;
            color: var(--primary);
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(1) { animation-delay: 0s; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--ground);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ Assam Travel Planner</h1>
            <p>Beautiful itineraries for your Assam adventure</p>
        </div>

        <div class="content">
            <div class="chat-container">
                <div class="messages" id="messages">
                    <div class="welcome">
                        <h2>Plan Your Journey</h2>
                        <p>Ask for a trip itinerary, place recommendations, or weather info</p>
                    </div>
                </div>

                <div class="input-area">
                    <input type="text" id="query" placeholder="Plan a 2-day Assam trip..." disabled />
                    <button id="send" disabled>Send</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">🏔️ Quick Queries</div>
                    <button class="sidebar-btn" onclick="quickSend('Plan a 2-day Assam trip')">2-Day Trip</button>
                    <button class="sidebar-btn" onclick="quickSend('Plan a 3-day Assam itinerary')">3-Day Trip</button>
                    <button class="sidebar-btn" onclick="quickSend('Wildlife and culture trip')">Wildlife Tour</button>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">🌤️ Weather</div>
                    <button class="sidebar-btn" onclick="quickSend('Weather in Guwahati')">Guwahati Weather</button>
                    <button class="sidebar-btn" onclick="quickSend('Best season to visit Assam')">Best Season</button>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">📍 Places</div>
                    <button class="sidebar-btn" onclick="quickSend('Tell me about Kamakhya Temple')">Kamakhya Temple</button>
                    <button class="sidebar-btn" onclick="quickSend('Pobitora Wildlife Sanctuary')">Pobitora</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8000';
        const messages = document.getElementById('messages');
        const query = document.getElementById('query');
        const sendBtn = document.getElementById('send');
        let sessionId = 'session_' + Date.now();

        // Check API
        fetch(API + '/health')
            .then(r => r.json())
            .then(() => {
                query.disabled = false;
                sendBtn.disabled = false;
            });

        function quickSend(q) {
            query.value = q;
            query.focus();
            sendMessage();
        }

        query.addEventListener('keypress', e => {
            if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const q = query.value.trim();
            if (!q) return;

            query.value = '';
            sendBtn.disabled = true;

            // Clear welcome
            const welcome = messages.querySelector('.welcome');
            if (welcome) welcome.remove();

            // User message
            const userMsg = document.createElement('div');
            userMsg.style.textAlign = 'right';
            userMsg.innerHTML = `<div style="display:inline-block;background:var(--primary);color:white;padding:12px 16px;border-radius:8px;max-width:70%;word-wrap:break-word;">${q}</div>`;
            messages.appendChild(userMsg);

            // Loading
            const loadId = 'load_' + Date.now();
            messages.innerHTML += `<div id="${loadId}"><div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div></div>`;
            messages.scrollTop = messages.scrollHeight;

            try {
                const res = await fetch(API + '/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: q, session_id: sessionId })
                });

                document.getElementById(loadId)?.remove();

                if (!res.ok) {
                    const err = await res.json();
                    addMessage('error', '❌ ' + (err.detail || 'Error'));
                } else {
                    const data = await res.json();
                    renderResponse(data.answer, data.route_taken || '');
                }
            } catch (e) {
                document.getElementById(loadId)?.remove();
                addMessage('error', '❌ Network error');
            }

            sendBtn.disabled = false;
            messages.scrollTop = messages.scrollHeight;
            query.focus();
        }

        // Matches a line that starts a new day, e.g. "Day 1", "**Day 2: Wildlife**", "- Day 3"
        const DAY_HEADER_RE = /^[\s\-*]*\*{0,2}\s*Day\s+(\d+)\b\s*:?\s*\*{0,2}\s*(.*)$/i;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Minimal markdown -> HTML: escapes first, then re-enables **bold** and bullet lines.
        function mdToHtml(text) {
            let safe = escapeHtml(text.trim());
            safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            safe = safe.replace(/^[\-*]\s+/gm, '');
            return safe;
        }

        function renderResponse(text, routeTaken) {
            const routes = routeTaken.split(',').map(r => r.trim());
            const hasDayHeader = text.split('\n').some(line => DAY_HEADER_RE.test(line.trim()));

            if (hasDayHeader) {
                renderTripPlan(text);
            } else if (routes.includes('WX')) {
                renderWeatherResponse(text);
            } else if (routes.includes('KB')) {
                renderPlaceResponse(text);
            } else {
                addMessage('bot', text);
            }
        }

        function renderTripPlan(text) {
            const msg = document.createElement('div');
            msg.className = 'trip-plan';

            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            const days = [];
            let currentDay = null;
            let preamble = [];

            lines.forEach(line => {
                const match = line.match(DAY_HEADER_RE);
                if (match) {
                    if (currentDay) days.push(currentDay);
                    currentDay = { num: match[1], title: match[2] || `Day ${match[1]}`, activities: [] };
                } else if (currentDay) {
                    currentDay.activities.push(line);
                } else {
                    preamble.push(line);
                }
            });
            if (currentDay) days.push(currentDay);

            let html = `<div class="trip-header">
                <h2>📅 Trip Itinerary</h2>
                <span class="trip-duration">${days.length}-Day Adventure</span>
            </div>`;

            if (preamble.length) {
                html += `<p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">${mdToHtml(preamble.join(' '))}</p>`;
            }

            html += `<div class="days-container">`;
            days.forEach(day => {
                html += `<div class="day-card" data-day="Day ${day.num}">
                    <div class="day-title">${mdToHtml(day.title)}</div>
                    <div class="activities">`;
                day.activities.forEach(activity => {
                    html += `<div class="activity">
                        <div class="activity-time">•</div>
                        <div class="activity-text">${mdToHtml(activity)}</div>
                    </div>`;
                });
                html += `</div></div>`;
            });
            html += `</div>`;

            msg.innerHTML = html;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        function renderWeatherResponse(text) {
            const msg = document.createElement('div');
            msg.className = 'weather-card';
            msg.innerHTML = `<div class="weather-header">🌤️ Weather Information</div>
                <div style="font-size:14px;line-height:1.6;">${mdToHtml(text).replace(/\n/g, '<br>')}</div>`;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        function renderPlaceResponse(text) {
            const msg = document.createElement('div');
            msg.className = 'place-card';
            msg.innerHTML = `<div class="place-name">📍 Place Information</div>
                <div class="place-info">${mdToHtml(text).replace(/\n/g, '<br>')}</div>`;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        function addMessage(type, text) {
            const msg = document.createElement('div');
            if (type === 'error') {
                msg.style.color = 'var(--accent)';
            }
            const content = type === 'error' ? escapeHtml(text) : mdToHtml(text).replace(/\n/g, '<br>');
            msg.innerHTML = `<div style="background:white;padding:12px 16px;border-radius:8px;border-left:3px solid var(--primary);">${content}</div>`;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        query.focus();
    </script>
</body>
</html>
