<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assam Travel Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            height: 95vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header {
            background: white;
            padding: 20px 25px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            color: #999;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        .chat-box {
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .welcome {
            text-align: center;
            color: #999;
            padding: 30px 20px;
        }

        .welcome h2 {
            font-size: 20px;
            color: #667eea;
            margin-bottom: 10px;
        }

        /* Message Styles */
        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.bot .message-bubble {
            background: #f5f7fa;
            color: #333;
        }

        /* Card Styles */
        .trip-card {
            background: white;
            border: 2px solid #e8edf5;
            border-radius: 12px;
            padding: 16px;
            margin: 10px 0;
        }

        .trip-card h3 {
            color: #667eea;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .day-section {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
        }

        .day-title {
            font-weight: 700;
            color: #667eea;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .activity {
            color: #555;
            font-size: 12px;
            margin: 6px 0;
            padding-left: 12px;
            border-left: 2px solid #667eea;
        }

        .place-card {
            background: linear-gradient(135deg, #fff8f3 0%, #ffe8e0 100%);
            border-left: 4px solid #ff6b6b;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .place-name {
            font-weight: 600;
            color: #ff6b6b;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .place-info {
            font-size: 12px;
            color: #666;
            line-height: 1.4;
        }

        .weather-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 14px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .weather-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .weather-item:last-child {
            border-bottom: none;
        }

        .tip-box {
            background: linear-gradient(135deg, #fff8e1 0%, #ffe8a8 100%);
            border-left: 4px solid #ffc107;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            color: #856404;
            font-size: 12px;
        }

        .loading {
            display: flex;
            gap: 6px;
            align-items: center;
            color: #667eea;
            font-size: 12px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .input-area button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Sidebar */
        .sidebar {
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-section {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .sidebar-title {
            font-weight: 600;
            color: #667eea;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .sidebar-btn {
            display: block;
            width: 100%;
            padding: 9px 12px;
            margin-bottom: 6px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            text-align: left;
            transition: all 0.3s;
        }

        .sidebar-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
            .message-bubble {
                max-width: 85%;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ Assam Travel Bot</h1>
            <p>Your AI-powered travel guide to Assam's hidden gems</p>
        </div>

        <div class="main-content">
            <div class="chat-box">
                <div class="messages-area" id="messagesArea">
                    <div class="welcome">
                        <h2>Welcome to Assam! 👋</h2>
                        <p>Ask me about places, plan your trip, or check the weather</p>
                    </div>
                </div>

                <div class="input-area">
                    <form onsubmit="sendMessage(event)" style="display: flex; gap: 10px; width: 100%;">
                        <input type="text" id="queryInput" placeholder="Ask about places, plan trips, check weather..." disabled />
                        <button type="submit" id="sendBtn" disabled>Send</button>
                    </form>
                </div>
            </div>

            <div class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">🏔️ Places</div>
                    <button class="sidebar-btn" onclick="quickQuery('Tell me about Kamakhya Temple')">Kamakhya Temple</button>
                    <button class="sidebar-btn" onclick="quickQuery('Pobitora Wildlife Sanctuary')">Pobitora Wildlife</button>
                    <button class="sidebar-btn" onclick="quickQuery('What about Deepor Beel?')">Deepor Beel</button>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">🌤️ Weather</div>
                    <button class="sidebar-btn" onclick="quickQuery('Weather in Guwahati')">Guwahati Weather</button>
                    <button class="sidebar-btn" onclick="quickQuery('Sunrise and sunset times')">Sunrise/Sunset</button>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">✈️ Plans</div>
                    <button class="sidebar-btn" onclick="quickQuery('Plan a 2-day Assam trip')">2-Day Trip</button>
                    <button class="sidebar-btn" onclick="quickQuery('3-day itinerary')">3-Day Trip</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const messagesArea = document.getElementById('messagesArea');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');
        let sessionId = 'session_' + Date.now();

        // Check API
        fetch(API_URL + '/health')
            .then(r => r.json())
            .then(() => {
                queryInput.disabled = false;
                sendBtn.disabled = false;
            })
            .catch(() => {
                messagesArea.innerHTML = '<div style="color:red;padding:20px;">❌ Cannot connect to bot API</div>';
            });

        function quickQuery(q) {
            queryInput.value = q;
            queryInput.focus();
        }

        async function sendMessage(e) {
            e.preventDefault();
            const query = queryInput.value.trim();
            if (!query) return;

            queryInput.value = '';
            sendBtn.disabled = true;

            // Remove welcome on first message
            const welcome = messagesArea.querySelector('.welcome');
            if (welcome) welcome.remove();

            // Add user message
            addMessage('user', query);

            // Add loading
            const loadingId = 'loading_' + Date.now();
            messagesArea.innerHTML += `<div class="message bot" id="${loadingId}">
                <div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            </div>`;
            messagesArea.scrollTop = messagesArea.scrollHeight;

            try {
                const response = await fetch(API_URL + '/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, session_id: sessionId })
                });

                document.getElementById(loadingId)?.remove();

                if (!response.ok) {
                    const error = await response.json();
                    addMessage('bot', '❌ ' + (error.detail || 'Error'));
                } else {
                    const data = await response.json();
                    formatAndAddMessage(data.answer);
                }
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                addMessage('bot', '❌ Network error: ' + err.message);
            }

            sendBtn.disabled = false;
            messagesArea.scrollTop = messagesArea.scrollHeight;
            queryInput.focus();
        }

        function addMessage(type, text) {
            const msg = document.createElement('div');
            msg.className = 'message ' + type;
            msg.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
            messagesArea.appendChild(msg);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function formatAndAddMessage(text) {
            const msg = document.createElement('div');
            msg.className = 'message bot';

            // Format as HTML with proper structure
            let html = '';

            // Check for trip/itinerary content
            if (text.toLowerCase().includes('day') || text.toLowerCase().includes('itinerary')) {
                html = `<div class="trip-card">
                    <h3>📅 Trip Itinerary</h3>
                    ${formatTripContent(text)}
                </div>`;
            }
            // Check for weather content
            else if (text.toLowerCase().includes('temperature') || text.toLowerCase().includes('weather') || text.toLowerCase().includes('sunrise')) {
                html = `<div class="weather-card">
                    ${text.replace(/\n/g, '<br>')}
                </div>`;
            }
            // Check for place info
            else if (text.toLowerCase().includes('temple') || text.toLowerCase().includes('sanctuary') || text.toLowerCase().includes('wildlife')) {
                html = `<div class="place-card">
                    <div class="place-name">📍 About This Place</div>
                    <div class="place-info">${text}</div>
                </div>`;
            }
            // Default formatting
            else {
                html = `<div class="message-bubble">${text.replace(/\n/g, '<br>')}</div>`;
            }

            msg.innerHTML = html;
            messagesArea.appendChild(msg);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function formatTripContent(text) {
            // Parse and format day-by-day itinerary
            const lines = text.split('\n');
            let html = '';
            let currentDay = '';

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                if (line.toLowerCase().includes('day')) {
                    if (currentDay) html += '</div>';
                    currentDay = line;
                    html += `<div class="day-section"><div class="day-title">📅 ${line}</div>`;
                } else if (line && currentDay) {
                    html += `<div class="activity">• ${line}</div>`;
                }
            });

            if (currentDay) html += '</div>';

            return html || text;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        queryInput.focus();
    </script>
</body>
</html>
