<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assam Travel Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 15px;
            height: 95vh;
        }

        .chat-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
            border-bottom: 3px solid rgba(255,255,255,0.2);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .header p {
            font-size: 13px;
            opacity: 0.95;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
            padding: 0 8px;
        }

        .weather-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-top: 8px;
            font-size: 12px;
        }

        .weather-card div {
            margin: 4px 0;
            display: flex;
            justify-content: space-between;
        }

        .sources-card {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 12px;
            color: #555;
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            margin-right: 5px;
            margin-top: 4px;
        }

        .welcome {
            text-align: center;
            color: #999;
            padding: 30px 20px;
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #667eea;
        }

        .welcome p {
            margin: 10px 0;
            font-size: 14px;
        }

        .example-queries {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 20px;
        }

        .example-btn {
            background: #f0f4ff;
            border: 1px solid #667eea;
            color: #667eea;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            text-align: left;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
        }

        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area input:disabled {
            background: #f5f5f5;
        }

        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }

        .input-area button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .sidebar-section {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .sidebar-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 13px;
            text-transform: uppercase;
        }

        .sidebar-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            text-align: left;
            transition: all 0.3s;
        }

        .sidebar-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #667eea;
            font-size: 13px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #c33;
            font-size: 13px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
            .message-bubble {
                max-width: 90%;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="chat-container">
            <div class="header">
                <h1>🗺️ Assam Travel Bot</h1>
                <p>Your AI travel guide for Assam's hidden gems</p>
            </div>

            <div class="chat-area" id="chatArea">
                <div class="welcome">
                    <h2>Welcome to Assam! 👋</h2>
                    <p>Ask me about places to visit, current weather, or plan your trip</p>
                    <div class="example-queries" id="exampleQueries"></div>
                </div>
            </div>

            <div class="input-area">
                <form onsubmit="sendMessage(event)" style="display: flex; gap: 10px; width: 100%;">
                    <input type="text" id="queryInput" placeholder="Ask about places, weather, travel plans..." disabled />
                    <button type="submit" id="sendBtn" disabled>📤 Send</button>
                </form>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">🏔️ Popular Places</div>
                <button class="sidebar-btn" onclick="quickQuery('Tell me about Kamakhya Temple')">Kamakhya Temple</button>
                <button class="sidebar-btn" onclick="quickQuery('What can I do at Pobitora Wildlife Sanctuary?')">Pobitora Wildlife</button>
                <button class="sidebar-btn" onclick="quickQuery('Tell me about Deepor Beel')">Deepor Beel</button>
                <button class="sidebar-btn" onclick="quickQuery('Describe Umananda Temple')">Umananda Temple</button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">🌤️ Weather</div>
                <button class="sidebar-btn" onclick="quickQuery('What is the weather in Guwahati today?')">Guwahati Weather</button>
                <button class="sidebar-btn" onclick="quickQuery('Show me sunrise and sunset times in Guwahati')">Sunrise/Sunset</button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">✨ About Bot</div>
                <p style="font-size: 12px; color: #666; line-height: 1.4;">
                    AI-powered travel guide for Assam. Get instant info on places, real-time weather, and expert tips.
                </p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const chatArea = document.getElementById('chatArea');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');
        let sessionId = 'session_' + Date.now();
        let messageCount = 0;

        const exampleQueries = [
            "Tell me about Kamakhya Temple",
            "What's the weather in Guwahati?",
            "Plan a 2-day nature and culture trip",
            "Show me sunrise/sunset times",
        ];

        // Populate example queries
        const exampleContainer = document.getElementById('exampleQueries');
        exampleQueries.forEach(q => {
            const btn = document.createElement('button');
            btn.className = 'example-btn';
            btn.textContent = q;
            btn.onclick = () => quickQuery(q);
            exampleContainer.appendChild(btn);
        });

        // Check API availability
        fetch(API_URL + '/health')
            .then(r => r.json())
            .then(data => {
                queryInput.disabled = false;
                sendBtn.disabled = false;
            })
            .catch(err => {
                chatArea.innerHTML = `<div class="error">❌ Cannot connect to bot API<br>Make sure: docker-compose up</div>`;
            });

        async function quickQuery(query) {
            queryInput.value = query;
            queryInput.focus();
        }

        async function sendMessage(e) {
            e.preventDefault();
            const query = queryInput.value.trim();
            if (!query) return;

            queryInput.value = '';
            sendBtn.disabled = true;

            addMessage('user', query);

            const loadingId = 'loading_' + Date.now();
            chatArea.innerHTML += `<div class="message bot" id="${loadingId}">
                <div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            </div>`;
            scrollToBottom();

            try {
                const response = await fetch(API_URL + '/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, session_id: sessionId })
                });

                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.remove();

                if (!response.ok) {
                    const error = await response.json();
                    addMessage('bot', '❌ Error: ' + (error.detail || response.statusText));
                } else {
                    const data = await response.json();
                    addMessage('bot', data.answer, data);
                }
            } catch (err) {
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.remove();
                addMessage('bot', '❌ Network error: ' + err.message);
            }

            scrollToBottom();
            sendBtn.disabled = false;
            queryInput.focus();
        }

        function addMessage(type, content, metadata) {
            messageCount++;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let html = `<div class="message ${type}">
                <div>
                    <div class="message-bubble">
                        ${escapeHtml(content)}`;

            if (type === 'bot' && metadata) {
                if (metadata.route_taken) {
                    html += `<div class="sources-card">
                        <strong>🎯 Route:</strong>`;

                    metadata.route_taken.split(', ').forEach(r => {
                        const icons = { 'KB': '📚', 'WX': '🌤️', 'EXP': '👤' };
                        html += `<span class="badge">${icons[r] || ''} ${r}</span>`;
                    });

                    if (metadata.sources && Object.keys(metadata.sources).length > 0) {
                        html += `<div style="margin-top: 8px;"><strong>📌 Sources:</strong><br>`;
                        if (metadata.sources.kb_results) {
                            html += `📍 ${metadata.sources.kb_results.map(r => r.site_name).join(', ')}<br>`;
                        }
                        if (metadata.sources.weather_location) {
                            html += `🌤️ ${metadata.sources.weather_location}`;
                        }
                        html += `</div>`;
                    }

                    html += `<div style="margin-top: 6px; font-size: 10px; opacity: 0.7;">
                        Confidence: ${(metadata.confidence * 100).toFixed(0)}%
                    </div></div>`;
                }
            }

            html += `</div>
                    <div class="message-time">${time}</div>
                </div>
            </div>`;

            chatArea.innerHTML += html;

            if (messageCount === 1 && chatArea.querySelector('.welcome')) {
                chatArea.querySelector('.welcome').remove();
            }
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        queryInput.focus();
    </script>
</body>
</html>
