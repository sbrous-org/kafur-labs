<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oxomiai — Chat Demo</title>
<style>
  :root{
    --dark-green:#1b3a29;
    --mid-green:#2d5c3c;
    --river-blue:#3e7c8b;
    --river-blue-light:#5b9aa9;
    --gold:#d4a33d;
    --terracotta:#d4741a;
    --cream:#f7f1e3;
    --cream-dark:#ece1cd;
    --brown:#2b1b12;
    --brown-soft:#594533;
    --gamosa-red:#ba2828;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0d0d0d;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
  }
  .phone{
    width:390px;
    max-height:844px;
    height:844px;
    background:var(--cream-dark);
    border-radius:36px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* HEADER */
  .header{
    background:var(--dark-green);
    padding:54px 20px 16px;
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }
  .sun-deco{position:absolute;top:-50px;right:-40px;width:120px;height:120px;border-radius:50%;background:var(--gold);opacity:.15;}
  .hill-deco{position:absolute;top:70px;left:-60px;width:220px;height:80px;border-radius:50%;background:var(--mid-green);opacity:.55;}
  .top-row{display:flex;align-items:center;gap:12px;position:relative;z-index:1;
    opacity:0; transform:translateY(-8px); animation: fadeUp .5s ease forwards; animation-delay:.1s;}
  .avatar-ring{width:54px;height:54px;border-radius:50%;background:var(--gamosa-red);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:3px;}
  .avatar-inner{width:100%;height:100%;border-radius:50%;background:var(--cream);
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .avatar-inner img{width:100%;height:100%;object-fit:cover;}
  .name-col{flex:1;min-width:0;}
  .bot-name{color:var(--cream);font-size:19px;font-weight:700;margin:0;line-height:1.3;}
  .bot-sub{color:#ccd4c2;font-size:12px;margin:2px 0 0;}
  .status{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .status-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);}
  .status span{color:#ccd4c2;font-size:11px;font-weight:500;}
  .season-chip{
    margin-top:14px;display:inline-flex;background:var(--mid-green);color:var(--cream);
    padding:7px 12px;border-radius:30px;font-size:11.5px;font-weight:500;position:relative;z-index:1;
    opacity:0; animation: fadeUp .5s ease forwards; animation-delay:.4s;
  }
  /* CHAT AREA */
  .chat-area{
    background:var(--cream);
    flex:1;
    overflow-y:auto;
    scroll-behavior:smooth;
    padding:20px 18px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .bubble{opacity:0;transform:translateY(10px);animation:fadeUp .45s ease forwards;}
  .bot-row{display:flex;align-items:flex-end;gap:8px;align-self:flex-start;max-width:270px;
    opacity:0;transform:translateY(10px);animation:fadeUp .45s ease forwards;}
  .bot-row .mini-avatar{width:24px;height:24px;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 2px #fff;}
  .bot-row .mini-avatar img{width:100%;height:100%;object-fit:cover;}
  .bot-bubble{
    background:#fff;max-width:246px;padding:13px 15px;font-size:13.5px;line-height:1.4;color:var(--brown);
    border-radius:4px 18px 18px 18px; box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .user-bubble{
    background:var(--river-blue);color:#fff;max-width:250px;padding:12px 15px;font-size:13.5px;font-weight:500;
    border-radius:18px 4px 18px 18px; align-self:flex-end;
  }
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;opacity:0;transform:translateY(10px);animation:fadeUp .45s ease forwards;}
  .chip{background:var(--cream-dark);color:var(--brown-soft);padding:8px 13px;border-radius:30px;font-size:12.5px;font-weight:500;}
  .chip.topic{background:#fff;}
  .chip.highlight{background:var(--mid-green);color:#fff;}
  .chip.highlight2{background:var(--terracotta);color:#fff;}
  .typing{align-self:flex-start;background:#fff;border-radius:4px 18px 18px 18px;padding:13px 16px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);opacity:0;animation:fadeUp .3s ease forwards;margin-left:32px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:#b9b0a2;display:inline-block;margin-right:3px;animation:blink 1.1s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,60%,100%{opacity:.3;} 30%{opacity:1;}}

  /* ITINERARY CARD */
  .itin-card{
    background:#fff;border-radius:18px;padding:16px 18px 14px;box-shadow:0 4px 14px rgba(0,0,0,.1);
    opacity:0;transform:translateY(10px);animation:fadeUp .45s ease forwards;
  }
  .itin-title{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14.5px;color:var(--brown);margin:0 0 2px;}
  .itin-sub{font-size:11px;color:var(--brown-soft);margin:0 0 14px;}
  .river{position:relative;padding-left:34px;}
  .river-line{position:absolute;left:14px;top:8px;bottom:8px;width:3px;background:var(--river-blue-light);border-radius:2px;}
  .day{position:relative;margin-bottom:16px;opacity:0;transform:translateX(-8px);animation:fadeRight .4s ease forwards;}
  .day:last-child{margin-bottom:0;}
  .day-node{position:absolute;left:-34px;top:0;width:30px;height:30px;border-radius:50%;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.04);}
  .day-title{font-size:12.5px;font-weight:600;color:var(--brown);margin:2px 0 3px;}
  .day-desc{font-size:11px;color:var(--brown-soft);line-height:1.4;margin:0 0 6px;}
  .tag{display:inline-block;color:#fff;font-size:10px;font-weight:500;padding:4px 9px;border-radius:30px;}

  /* HIDDEN GEMS CARD */
  .gems-card{
    background:#fff;border-radius:18px;padding:16px 18px 14px;box-shadow:0 4px 14px rgba(0,0,0,.1);
    opacity:0;transform:translateY(10px);animation:fadeUp .45s ease forwards;
  }
  .gem-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;opacity:0;transform:translateY(8px);animation:fadeUp .4s ease forwards;}
  .gem-item:last-child{margin-bottom:0;}
  .gem-icon{width:34px;height:34px;border-radius:10px;background:var(--mid-green);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .gem-title{font-size:12.5px;font-weight:600;color:var(--brown);margin:0 0 2px;}
  .gem-desc{font-size:11px;color:var(--brown-soft);line-height:1.4;margin:0 0 4px;}
  .gem-tag{display:inline-block;background:#fef3e2;color:var(--terracotta);font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.02em;}

  /* LOCAL EXPERT CARD */
  .expert-card{
    background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 4px 14px rgba(0,0,0,.1);
    opacity:0;transform:translateY(10px);animation:fadeUp .45s ease forwards;
    display:flex;flex-direction:column;gap:10px;
  }
  .expert-top{display:flex;gap:12px;align-items:center;}
  .expert-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--terracotta));
    display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;color:#fff;}
  .expert-name{font-size:14px;font-weight:700;color:var(--brown);margin:0;}
  .expert-sub{font-size:11px;color:var(--brown-soft);margin:2px 0 0;line-height:1.4;}
  .expert-status{display:flex;align-items:center;gap:5px;margin-top:4px;}
  .expert-status .dot{width:7px;height:7px;border-radius:50%;background:#3fae5a;}
  .expert-status span{font-size:10.5px;color:#3fae5a;font-weight:600;}
  .expert-btn{background:var(--terracotta);color:#fff;border:none;padding:11px;border-radius:14px;
    font-size:13px;font-weight:600;text-align:center;}

  /* END CARD */
  .end-card{
    align-self:center;text-align:center;padding:26px 20px 10px;
    opacity:0;transform:translateY(10px);animation:fadeUp .6s ease forwards;
  }
  .end-card img{width:110px;height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.15));}
  .end-title{font-size:15px;font-weight:700;color:var(--brown);margin:8px 0 4px;}
  .end-sub{font-size:11.5px;color:var(--brown-soft);line-height:1.5;max-width:260px;margin:0 auto;}

  @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
  @keyframes fadeRight{to{opacity:1;transform:translateX(0);}}

  /* QUICK TOPICS */
  .topics{background:var(--cream-dark);display:flex;gap:10px;padding:12px 16px;overflow-x:auto;flex-shrink:0;
    opacity:0;animation:fadeUp .45s ease forwards;}

  /* INPUT BAR */
  .input-bar{background:var(--dark-green);display:flex;align-items:center;gap:10px;padding:12px 14px 28px;flex-shrink:0;}
  .input-pill{flex:1;background:#fff;border-radius:24px;height:44px;display:flex;align-items:center;padding:0 16px;
    color:#8c877a;font-size:13px;}
  .send-btn{width:44px;height:44px;border-radius:50%;background:var(--terracotta);display:flex;align-items:center;
    justify-content:center;font-size:19px;flex-shrink:0;}

  .replay{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;border:none;
    padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;color:var(--brown);cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.3);}
</style>
</head>

const t0 = performance.now();
function mark(label){ console.log('[t]', ((performance.now()-t0)/1000).toFixed(2)+'s', label); }

function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstElementChild;
}
function scrollDown(){ chatArea.scrollTo({top: chatArea.scrollHeight, behavior:'smooth'}); }

function botMsg(html){
  return `<div class="bot-row"><div class="mini-avatar"><img src="${FACE}"></div><div class="bot-bubble">${html}</div></div>`;
}

function showTyping(delayMs, cb){
  setTimeout(()=>{
    const t = el(`<div class="typing"><span></span><span></span><span></span></div>`);
    chatArea.appendChild(t); scrollDown();
    setTimeout(()=>{ t.remove(); cb(); }, 900);
  }, delayMs);
}
