version: "3.9"

# TARGET-ARCHITECTURE reference only — NOT used by the POC.
# The POC runs from the repo-root docker-compose.yml (one FastAPI service +
# one static frontend). This file sketches the shared infra the microservices
# design in ARCHITECTURE.md would need. Spin up shared infra first, then add
# each service as its own build context under services/<name> once it exists.

services:
  # ---------- Shared infrastructure ----------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oxomiai
      POSTGRES_PASSWORD: oxomiai
      POSTGRES_DB: oxomiai
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["9092:9092"]

  # ---------- Core services (uncomment as each is built) ----------
  # api-gateway:
  #   build: ./services/api-gateway
  #   ports: ["8080:8080"]
  #   depends_on: [user-service, conversation-orchestrator]

