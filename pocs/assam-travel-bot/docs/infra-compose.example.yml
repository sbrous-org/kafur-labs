  #     ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

  # itinerary-service:
  #   build: ./services/itinerary-service
  #   environment:
  #     MONGO_URL: mongodb://mongo:27017/itineraries
  #   depends_on: [mongo]

  # hidden-gems-service:
  #   build: ./services/hidden-gems-service
  #   depends_on: [mongo]

  # local-expert-service:
  #   build: ./services/local-expert-service
