services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - bot
    networks:
      - bot-network

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - ENV=development
    volumes:
      - ./knowledge_base:/app/knowledge_base
      - ./backend:/app
    depends_on:
      - db
    networks:
      - bot-network
    healthcheck:
      # python:3.11-slim has no curl — use the stdlib client
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=travelbot
      - POSTGRES_USER=travelbot
      - POSTGRES_PASSWORD=travelbot_dev_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelbot"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  bot-network:
    driver: bridge

volumes:
  db_data:
